name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: package the plugin and write the SBOM
        run: |
          tar czf "proofloop-${GITHUB_REF_NAME}.tgz" .claude-plugin skills agents hooks bin dist protocols templates examples README.md CHANGELOG.md
          npm sbom --omit dev --sbom-format cyclonedx > "proofloop-${GITHUB_REF_NAME}.sbom.json"
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: proofloop-*.tgz
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            proofloop-*.tgz
            proofloop-*.sbom.json
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
      - name: publish to npm with provenance (only when the NPM_TOKEN secret is set)
        if: env.NPM_TOKEN != ''
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm publish --access public --provenance --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
