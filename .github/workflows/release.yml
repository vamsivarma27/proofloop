name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: package the plugin
        run: |
          tar czf "proofloop-${GITHUB_REF_NAME}.tgz" .claude-plugin skills agents hooks bin dist protocols templates examples README.md CHANGELOG.md
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: proofloop-*.tgz
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
